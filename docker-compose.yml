# Skyway + Traefik para tu servidor dedicado.
#   1. cp .env.example .env   (ajusta SKYWAY_DOMAIN y LETSENCRYPT_EMAIL si quieres TLS)
#   2. docker compose up -d --build
#   3. Accede por https://SKYWAY_DOMAIN (recomendado), o por tunel SSH si aun no tienes dominio:
#        ssh -L 4000:127.0.0.1:4000 TU_USUARIO@IP-DEL-SERVIDOR   -> luego abre http://localhost:4000
#      y crea tu cuenta.

services:
  skyway:
    build: .
    container_name: skyway
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # Dominio del panel: el puente de Traefik de Mailway nunca acepta una ruta
      # para este dominio (ver /api/traefik/mailway).
      SKYWAY_DOMAIN: ${SKYWAY_DOMAIN:-}
      # JWT_SECRET: define uno propio si quieres sesiones estables entre reinstalaciones
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - skyway-data:/data
    networks:
      - skyway-edge
    ports:
      - "127.0.0.1:4000:4000" # UI solo accesible en local (tunel SSH); acceso publico por dominio via Traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=skyway-edge
      - traefik.http.routers.skyway.rule=Host(`${SKYWAY_DOMAIN:-skyway.localhost}`)
      - traefik.http.routers.skyway.entrypoints=web
      # El puerto 80 solo redirige: la contrasena y la cookie de sesion del panel
      # no viajan en claro. Sin dominio propio el acceso es por el tunel SSH de
      # arriba (127.0.0.1:4000), que no pasa por Traefik.
      - traefik.http.middlewares.skyway-https.redirectscheme.scheme=https
      - traefik.http.middlewares.skyway-https.redirectscheme.permanent=true
      - traefik.http.routers.skyway.middlewares=skyway-https
      - traefik.http.routers.skyway-secure.rule=Host(`${SKYWAY_DOMAIN:-skyway.localhost}`)
      - traefik.http.routers.skyway-secure.entrypoints=websecure
      - traefik.http.routers.skyway-secure.tls.certresolver=le
      - traefik.http.services.skyway.loadbalancer.server.port=4000

  traefik:
    # Versión exacta: los parches llegan como PR de Dependabot que han pasado la
    # CI, y `skyway update` los aplica (y vuelve atrás si algo falla). Con una
    # etiqueta flotante como «v3.7», `docker compose up` seguiría usando la
    # imagen que ya tuviera el servidor: solo descarga las que faltan.
    image: traefik:v3.7.14
    container_name: skyway-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skyway-edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # IP real del visitante detrás del proxy de Cloudflare: en el 443 se
      # respeta el X-Forwarded-For que manda Cloudflare (solo si la conexión
      # viene de sus rangos), así que las apps reciben la IP del visitante
      # (la primera de la derecha que no es de Cloudflare ni de Traefik). De
      # cualquier otra IP, Traefik lo sigue borrando: nadie puede falsearla
      # conectando directamente. En el 80 no se confía en nadie a propósito:
      # con el modo SSL/TLS «Flexible», Cloudflare entra por ahí diciendo
      # «https» y, si se le creyera, la web se serviría sin cifrar entre
      # Cloudflare y el servidor en vez del bucle que Skyway detecta y avisa.
      # Rangos de https://www.cloudflare.com/ips/ (los mismos que
      # CLOUDFLARE_IPV4 y CLOUDFLARE_IPV6 en server/src/domains.ts; una prueba
      # comprueba que coinciden).
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-noreply@example.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Rutas de Mailway (webmail de marca blanca y autoconfiguración de los
      # dominios de correo de los clientes). Traefik las lee de Skyway, que las
      # obtiene de Mailway y las filtra: solo reglas Host() hacia contenedores
      # de Mailway y nunca un dominio que ya sirva Skyway. Sin Mailway
      # configurado, Skyway responde una configuración vacía y no cambia nada.
      - --providers.http.endpoint=http://skyway:4000/api/traefik/mailway
      - --providers.http.pollInterval=15s
      # Holgura sobre los 5 s que Skyway espera a Mailway antes de servir la
      # última configuración buena.
      - --providers.http.pollTimeout=10s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - skyway-edge

networks:
  # Red compartida: Skyway conecta aquí los contenedores que tienen dominio
  # para que Traefik pueda enrutarles tráfico.
  skyway-edge:
    name: skyway-edge

volumes:
  skyway-data:
  traefik-letsencrypt:
