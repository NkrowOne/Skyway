# Actualizaciones de dependencias con Dependabot.
#
# Los parches (x.y.Z) de cada ecosistema llegan agrupados en un solo PR con un
# grupo «parches-…», y las correcciones de seguridad de npm que son parche, en
# el grupo «seguridad-npm». Esos PR se fusionan solos cuando la CI pasa entera
# (.github/workflows/parches-automaticos.yml); el servidor los aplica esa noche
# con `skyway update --auto`, que vuelve atrás si algo falla. Lo demás (versiones
# menores y mayores) llega en PR sueltos que revisa una persona.
#
# Cada ecosistema tiene su día: el flujo solo fusiona un PR que ya incluye todo
# lo que hay en main (lo fusionado es exactamente lo que probó la CI), y dos PR
# abiertos a la vez se dejarían atrás el uno al otro.
version: 2
updates:
  - package-ecosystem: npm
    # Raíz del monorepo: los workspaces (server, web) comparten package-lock.json.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: dependencias
    groups:
      # React y sus tipos llegan juntos: por separado (react-dom 19 con react
      # 18, #79) los tipos se mezclan y nada compila. Los parches siguen en
      # «parches-npm», que va después; el primer grupo que encaja se queda la
      # actualización.
      react:
        applies-to: version-updates
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [minor, major]
      parches-npm:
        applies-to: version-updates
        update-types: [patch]
        patterns: ["*"]
      seguridad-npm:
        applies-to: security-updates
        update-types: [patch]
        patterns: ["*"]
    ignore:
      # zod 4 retira required_error, invalid_type_error y errorMap (las rutas
      # los usan) y cambia los textos por defecto de los errores, que llegan
      # a las respuestas de la API: es una migración aparte, como en Mailway.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # vite 8 compila con Rolldown y necesita @vitejs/plugin-react 6 (la 4.7
      # solo admite hasta vite 7): se sube junto con el plugin, a mano.
      - dependency-name: vite
        versions: [">=8.0.0"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6.0.0"]
      # @types/node sigue a la versión de Node con la que corre el panel (22):
      # los tipos de una versión posterior dejan usar lo que Node 22 no tiene.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      # CONGELADAS: no se actualizan salvo por algo crítico (un fallo de
      # seguridad grave que solo arregla la versión nueva, o que la nuestra
      # deje de recibir parches). Funcionan bien como están y subirlas es una
      # migración con riesgo que no aporta nada. Si llega ese caso, se hace en
      # un PR propio, probado en el navegador, nunca con el de Dependabot. Las
      # menores y los parches de estas sí siguen llegando.
      # - TypeScript 6/7: el lint (typescript-eslint) aún no lo admite y los
      #   editores pierden el autocompletado; el JavaScript que sale es igual.
      # - React 19 (react, react-dom y sus tipos): cambia refs, StrictMode y
      #   Suspense y engorda el panel; hay que revisarlo entero.
      # - Tailwind 4: la configuración pasa a CSS y cambian clases. Los avisos
      #   de seguridad de Tailwind 3 (braces, postcss-selector-parser) solo
      #   afectan a la compilación, que lee nuestro propio CSS.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  # Imágenes base del Dockerfile (Node sobre Alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: dependencias
    ignore:
      # Un salto de versión mayor (Node 24, Traefik 4) es una migración, no un parche.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      parches-imagenes:
        update-types: [patch]
        patterns: ["*"]

  # Imágenes de docker-compose.yml (Traefik).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: dependencias
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      parches-compose:
        update-types: [patch]
        patterns: ["*"]

  # Acciones de la CI. Sus PR nunca se fusionan solos: modifican
  # .github/workflows y GitHub no deja que el token de un flujo lo haga. Tampoco
  # llegan al servidor.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: dependencias
    groups:
      parches-acciones:
        update-types: [patch]
        patterns: ["*"]
