name: CI

# Verifica cada push (cualquier rama, para tener señal antes del merge a main) y cada PR.
on:
  push:
  pull_request:

# Un push nuevo sobre la misma rama cancela el chequeo anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck (server + web)
        run: npm run typecheck
      - name: Build (web + server)
        run: npm run build
